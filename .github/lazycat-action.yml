version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/ryot.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: ryot

build:
  run_buildscript: false

images:
  # 版本源镜像：上游 v10.x 系列（完整三段式 SemVer tag）
  - id: ryot
    target: service
    service: ryot
    source: ignisda/ryot
    channel: stable
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
  # 数据库镜像：固定 16-alpine 家族（tag 带后缀，custom 通道映射为 SemVer）
  - id: ryot-db
    target: service
    service: ryot-db
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: '^16\.\d+-alpine$'
    version_regex: '^16\.(?P<minor>\d+)-alpine$'
    version_template: '16.{minor}.0'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Ryot
    summary: 一个用于追踪生活各方面的自托管平台
